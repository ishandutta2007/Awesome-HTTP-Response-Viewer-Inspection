<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-20px, 20px); opacity: 0.5; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pingDot {
      0% { r: 4px; opacity: 1; }
      100% { r: 12px; opacity: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 150px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 250px; }
    .stream-line { stroke-dasharray: 8 12; animation: dashStream 3s linear infinite; }
    .stream-line-rev { stroke-dasharray: 6 10; animation: dashStream 4s linear infinite reverse; }
    .pill-1 { animation: floatPill 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill 5s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill 4.5s ease-in-out infinite 0.5s; }
    .pill-4 { animation: floatPill 5.5s ease-in-out infinite 1.5s; }
    .ping-circle { animation: pingDot 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="140" r="160" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="240" r="190" fill="url(#purpleGlow)" filter="url(#glow)" />

  <!-- Background Grid -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Network Waves & Stream Lines in Background -->
  <g opacity="0.45">
    <path class="stream-line" d="M 0 320 C 300 260, 450 370, 750 300 C 950 250, 1050 330, 1200 290" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line-rev" d="M 0 350 C 250 390, 500 290, 800 360 C 1000 410, 1100 320, 1200 340" fill="none" stroke="#a855f7" stroke-width="1.8" />
  </g>

  <!-- Decorative Interactive Inspection Cards (Background Layer) -->
  <g class="pill-1" transform="translate(60, 45)">
    <rect width="210" height="52" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="22" cy="26" r="6" fill="#10b981" />
    <circle class="ping-circle" cx="22" cy="26" r="6" stroke="#10b981" fill="none" stroke-width="1.5" />
    <text x="36" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12">HTTP/2 200 OK</text>
    <text x="36" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">size: 1.4 KB • 12ms</text>
  </g>

  <g class="pill-2" transform="translate(930, 45)">
    <rect width="210" height="52" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="22" cy="26" r="6" fill="#6366f1" />
    <text x="36" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12">TLS 1.3 MITM</text>
    <text x="36" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Decrypted &amp; Inspected</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitles -->
  <!-- Top Category Pill -->
  <g transform="translate(450, 42)">
    <rect width="300" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#64748b" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="1">CURATED DEVELOPER DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">
    HTTP Response Viewer &amp; Inspection
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="185" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" letter-spacing="0.2">
    Traffic Interception • Payload Analysis • Self-Hosted &amp; Cloud Debugging Proxies
  </text>

  <!-- Descriptive Secondary Subtitle -->
  <text x="600" y="215" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
    Comprehensive directory of SaaS platforms, desktop MITM proxies &amp; open-source response inspection tools
  </text>

  <!-- Interactive Badges / Tags Carousel Row (Foreground bottom) -->
  <g transform="translate(180, 260)">
    <!-- Pill 1: SSL Decryption -->
    <g class="pill-3" transform="translate(0, 0)">
      <rect width="185" height="42" rx="21" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
      <text x="92" y="26" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">🔒 SSL/TLS Decryption</text>
    </g>

    <!-- Pill 2: MITM & Interception -->
    <g class="pill-4" transform="translate(205, 0)">
      <rect width="210" height="42" rx="21" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" />
      <text x="105" y="26" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">⚡ MITM Traffic Capture</text>
    </g>

    <!-- Pill 3: JSON & HAR Inspection -->
    <g class="pill-3" transform="translate(435, 0)">
      <rect width="200" height="42" rx="21" fill="#1e293b" fill-opacity="0.9" stroke="#c084fc" stroke-width="1" />
      <text x="100" y="26" text-anchor="middle" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">📦 JSON &amp; HAR Viewer</text>
    </g>

    <!-- Pill 4: Mocking & Rules -->
    <g class="pill-4" transform="translate(655, 0)">
      <rect width="185" height="42" rx="21" fill="#1e293b" fill-opacity="0.9" stroke="#34d399" stroke-width="1" />
      <text x="92" y="26" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">🛠️ Mocking &amp; Rewriting</text>
    </g>
  </g>

  <!-- Bottom Mini Live Status Bar -->
  <g transform="translate(380, 340)">
    <rect width="440" height="36" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#22c55e" />
    <text x="35" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan fill="#f1f5f9" font-weight="600">GET</tspan> /api/v1/inspect <tspan fill="#64748b">→</tspan> <tspan fill="#4ade80" font-weight="600">200 OK</tspan> (Content-Type: application/json)
    </text>
  </g>
</svg>